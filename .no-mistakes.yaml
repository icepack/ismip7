# Repository configuration for the no-mistakes gate. Read from the trusted
# default branch, not from the pushed branch, so it takes effect once merged.
allow_repo_commands: true
# No CI runs on this repository (no .github/workflows). Without this the
# gate's CI step waits up to ci_timeout for checks that never register.
no_ci: true
commands:
  # The unit suite: serial, tiny Firedrake meshes, a few seconds. Without a
  # configured command the test step's agent improvises an end-to-end harness
  # that twice exceeded the step's 30-minute limit.
  #
  # `python` is the icepack2/Firedrake environment's interpreter, assumed
  # already active, exactly as every script in this repository assumes (see
  # AGENTS.md). Which environment that is, and how it is entered, is a
  # machine-local concern and deliberately stays outside this shared file.
  test: "python -m pytest tests/ -q"
# Bring a moved base in with a merge commit. AGENTS.md: never rebase a branch
# that has been pushed, and a later push through the gate is usually to one.
# Read from the default branch like the rest, so it takes effect once merged.
rebase:
  strategy: merge
